name: release

# Release CI for llama-wasm. Triggered only by a `v*` tag, it runs the exact
# same wasmify pipeline as build.yml (so the released artifacts are rebuilt from
# the tagged source, not promoted from an unverified earlier run), stages the
# release assets, attaches SLSA build-provenance attestations, and creates the
# GitHub Release.
#
# Assets:
#   * llama.wasm            — raw wasi-sdk artifact (binaryen-optimised).
#   * llama_wasm2go.go      — protoc-gen-wasmify-go's wasm2go bridge, which
#                             go-llama commits as llama.go.
#   * llama_wasm2go.tar.gz  — the build/wasm2go/internal/wasm2go bundle, a
#                             self-contained Go module after bundle-gomod, which
#                             the llamawasm2go module repo downloads and extracts.
#   * llama_wasm2go.sha256  — sha256sum manifest of the tarball contents; doubles
#                             as the attestation subject-checksums so any
#                             extracted file verifies individually.
#
# Releasing lives ONLY here, never in build.yml — so pull requests and main
# pushes build and verify but never publish. No `tags:` trigger in build.yml
# means a tag push runs this workflow alone (no double build, no race).
#
# The toolchain (wasi-sdk, binaryen, buf, the wasmify CLI) lives inside the
# wasmify base image, so the build runs entirely in a container. Unlike
# build.yml, NO build cache is restored here: a release always compiles
# every object from the tagged source. That is the generic guarantee that
# whatever the tree configures — every patches/*.patch, present and future —
# is what the shipped artifact was compiled from; incremental-build machinery
# and its invalidation bugs are structurally out of the trust path. (v0.2.4
# shipped without a new patch because a warm object cache went stale.)
# Releases are rare, so the extra ~25 minutes is a fair price.
# `docker run` (not the GHA `container:` directive) so a free-disk-space step
# can run on the host before the container starts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # create the GitHub Release + upload assets
  id-token: write          # actions/attest-build-provenance OIDC token
  attestations: write

env:
  # Pinned to a released wasmify image.
  WASMIFY_IMAGE: ghcr.io/goccy/wasmify:v0.6.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull the wasmify build image
        run: docker pull "$WASMIFY_IMAGE"

      - name: Run wasmify pipeline
        # The same sequence as `make wasm`, regenerating every derived artefact
        # (build.json, api-spec.json, proto/, bridge/, the wasm2go bundle) from
        # source — so none of them are committed. Always a cold build: see the
        # header comment.
        # `buf generate --timeout 0` disables buf's 2-minute plugin timeout: the
        # wasm2go flavour SSA-lowers a wasm this size over several minutes, and
        # a SIGKILL there surfaces only as "signal: killed".
        run: |
          docker run -d --name wasmify-build \
            -v "$PWD:/work" -w /work \
            -e WASMIFY_NON_INTERACTIVE=1 \
            --entrypoint sleep \
            "$WASMIFY_IMAGE" infinity
          docker exec wasmify-build bash -ceuxo pipefail '
            make tools
            bash scripts/wasi-configure.sh
            wasmify build --non-interactive
            wasmify generate-build
            wasmify parse-headers --header llama_api.h --clang "${WASI_SDK_PATH:-$HOME/.config/wasmify/bin/wasi-sdk}/bin/clang"
            wasmify gen-proto
            wasmify wasm-build --optimize --non-interactive
            rm -rf build
            eval "$(make -s print-wasm2go-env)"
            buf generate --timeout 0
            make bundle-gomod
          '

      - name: Verify spin-waits are preemptible in the built wasm
        # Artifact invariant for the wasm2go host, in the same family as
        # check-imports.py: a call-free atomic spin loop livelocks against the
        # Go GC no matter which source change introduces it — an upstream
        # llama.cpp bump adding a spin site the sched-yield patch does not
        # reach, the patch bitrotting, or any future build bug. Fails the
        # build before anything is published. See scripts/check-bare-spins.py.
        run: |
          # Pinned wabt release: the wasm is memory64 and Ubuntu's packaged
          # wabt (1.0.34) cannot parse 64-bit tables.
          WABT_VERSION=1.0.41
          WABT_SHA256=83f8122e924745fcd70636e3594bc01c4c47f2d4c8f3c63b5d70d3f83a482677
          curl -fsSL --proto '=https' --tlsv1.2 -o wabt.tar.gz \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-linux-x64.tar.gz"
          echo "${WABT_SHA256}  wabt.tar.gz" | sha256sum -c -
          tar xzf wabt.tar.gz "wabt-${WABT_VERSION}/bin/wasm-objdump"
          rm wabt.tar.gz
          PATH="$PWD/wabt-${WABT_VERSION}/bin:$PATH" \
            python3 scripts/check-bare-spins.py .wasmify/wasm-build/output/llama.wasm
          rm -rf "wabt-${WABT_VERSION}"

      - name: Stop build container
        if: always()
        run: docker rm -f wasmify-build 2>/dev/null || true

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/llama.wasm release/llama.wasm
          cp build/wasm2go/llama.go release/llama_wasm2go.go
          tar -czf release/llama_wasm2go.tar.gz -C build/wasm2go/internal/wasm2go .
          ( cd build/wasm2go/internal/wasm2go && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > release/llama_wasm2go.sha256
          # The bundle is only usable as a Go module; bundle-gomod must have run.
          test -f build/wasm2go/internal/wasm2go/go.mod \
            || { echo "::error::bundle go.mod missing — make bundle-gomod did not run"; exit 1; }
          # The wasm must import nothing beyond WASI and the C++ exception tag:
          # anything else means a host dependency slipped in that a Go consumer
          # would have to implement.
          python3 scripts/check-imports.py release/llama.wasm

      - uses: actions/attest-build-provenance@v2
        # Provenance only on `push` events and only when the repo is public.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/llama.wasm
            release/llama_wasm2go.go

      - uses: actions/attest-build-provenance@v2
        # wasm2go bundle: one attestation whose subjects are the per-file digests
        # in the manifest, so any file extracted from the tarball verifies.
        if: github.event.repository.visibility == 'public'
        with:
          subject-checksums: release/llama_wasm2go.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/llama.wasm
            release/llama_wasm2go.go
            release/llama_wasm2go.tar.gz
            release/llama_wasm2go.sha256

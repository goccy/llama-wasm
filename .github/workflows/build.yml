name: build

# Build + verify CI for llama-wasm. Runs the wasmify pipeline against the
# upstream `llama.cpp/` submodule from a clean checkout, produces `llama.wasm`
# (the wasi-sdk built inference library behind the thin embedding API) and the
# wasm2go bundle (`build/wasm2go/`, the transpiled pure-Go form go-llama
# consumes), uploads them as a workflow artifact, and attaches SLSA
# build-provenance attestations. It does NOT publish a GitHub Release —
# release.yml owns that, on `v*` tags.
#
# The toolchain (wasi-sdk, binaryen, buf, the wasmify CLI) lives inside the
# wasmify base image, so the build runs entirely in a container. On top of that
# base image this workflow maintains a project-specific cache image
# (ghcr.io/<owner>/llama-wasm-cache) keyed on the wasmify image tag, the
# llama.cpp submodule SHA, and the patch inputs (scripts/wasi-configure.sh
# plus patches/*.patch — they rewrite the submodule sources before the
# build, so the SHA alone does not identify what gets compiled): a
# successful cold build's container is
# `docker commit`ed so a warm run finishes incrementally (the EH-enabled C++
# runtimes and the .wasmify object cache are restored) instead of rebuilding
# from scratch — the runtimes alone take several minutes. Only `push` events
# publish the cache image; `pull_request` runs may read it but never write.
#
# `docker run` (not the GHA `container:` directive) so a free-disk-space step
# can run on the host before the container starts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hf_model:
        description: Hugging Face model the encoder benchmark converts and runs
        default: sbintuitions/modernbert-ja-310m
        type: string

permissions:
  contents: read           # build-only: no release asset upload here
  packages: write          # cache image push to ghcr
  id-token: write          # actions/attest-build-provenance OIDC token
  attestations: write

env:
  # Pinned to a released wasmify image. The cache image inherits this base layer
  # via `docker commit`, and the tag is baked into the cache key so a wasmify
  # upgrade rolls forward cleanly (a bumped tag misses the old cache and rebuilds).
  WASMIFY_IMAGE: ghcr.io/goccy/wasmify:v0.6.16
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/llama-wasm-cache

jobs:
  # The assembly-override bodies (kernels/): generator tests on both
  # architectures the bodies target, and a drift check that the
  # checked-in asm/ is what the generators emit.
  kernels:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernels/go.mod
      - name: Generated bodies match the generators
        working-directory: kernels
        run: |
          go run ./cmd/genkernels -out "$RUNNER_TEMP/kernels-asm"
          diff -r "$RUNNER_TEMP/kernels-asm" asm
      - name: Kernel tests
        working-directory: kernels
        run: go test ./... -count=1

  # The kernel differential gate: every assembly override body against the
  # C body it replaces, the dbg_* export of the llama.wasm the build job just
  # produced (compiled from the pinned llama.cpp commit). Same command as
  # `make verify-kernels` locally, on both architectures, with
  # -require-llama-wasm so a missing wasm or an uncompared export fails.
  # This is what turns a llama.cpp bump that changes a kernel's layout or
  # arithmetic into a red check instead of stale assembly on new data. Node
  # runs the wasm (memory64 needs Node 24+).
  kernel-diff:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernels/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: llama-wasm-${{ github.sha }}
          path: release
      - name: Kernel gates against the C bodies in llama.wasm
        working-directory: kernels
        run: |
          go test ./internal/asm -count=1 -run 'Gate$' \
            -args -require-llama-wasm -llama-wasm "$GITHUB_WORKSPACE/release/llama.wasm"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve cache image tag from wasmify version, submodule SHA, and patch inputs
        id: cache_key
        run: |
          submodule_sha=$(git -C llama.cpp rev-parse HEAD)
          wasmify_tag="${WASMIFY_IMAGE##*:}"
          if [ -z "$wasmify_tag" ] || [ "$wasmify_tag" = "$WASMIFY_IMAGE" ]; then
            wasmify_tag="untagged"
          fi
          # The submodule SHA alone does not identify the compiled sources:
          # scripts/wasi-configure.sh rewrites the checked-out submodule with
          # patches/*.patch before the build, so those files are cache-key
          # inputs too. When they were not, a new patch hit a stale object
          # cache and a release shipped compiled from unpatched sources while
          # the build log still said "applied patch".
          patch_hash=$({ cat scripts/wasi-configure.sh; cat patches/*.patch 2>/dev/null || true; } \
            | sha256sum | cut -c1-12)
          echo "tag=${CACHE_IMAGE}:${wasmify_tag}-${submodule_sha}-${patch_hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try to pull cache image
        # `docker pull` exits non-zero on a missing tag; a miss is not a failure,
        # downstream steps branch on the recorded `hit` flag.
        id: cache_pull
        continue-on-error: true
        run: |
          if docker pull "${{ steps.cache_key.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore generated files from cache image (warm path)
        # Cache hit: the cold build's .wasmify object cache and the EH-enabled
        # C++ runtimes live at /cache/output in the cache image. Copy them back
        # so wasmify's incremental detection and build-eh-runtimes.sh's version
        # stamp can short-circuit unchanged work.
        if: steps.cache_pull.outputs.hit == 'true'
        run: |
          container=$(docker create "${{ steps.cache_key.outputs.tag }}")
          docker cp "${container}:/cache/output/." "$PWD/"
          docker rm -f "${container}"
          ls -la .wasmify deps/wasi-eh 2>/dev/null | head -10 || true

      - name: Resolve build base image
        id: base
        run: |
          if [ "${{ steps.cache_pull.outputs.hit }}" = "true" ]; then
            echo "image=${{ steps.cache_key.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            docker pull "$WASMIFY_IMAGE"
            echo "image=$WASMIFY_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run wasmify pipeline
        # The same sequence as `make wasm`, regenerating every derived artefact
        # (build.json, api-spec.json, proto/, bridge/, the wasm2go bundle) from
        # source — so none of them are committed. Detached with `sleep infinity`
        # so the post-build container can be `docker commit`ed (cache miss only).
        # `buf generate --timeout 0` disables buf's 2-minute plugin timeout: the
        # wasm2go flavour SSA-lowers a wasm this size over several minutes, and
        # a SIGKILL there surfaces only as "signal: killed".
        run: |
          docker run -d --name wasmify-build \
            -v "$PWD:/work" -w /work \
            -e WASMIFY_NON_INTERACTIVE=1 \
            --entrypoint sleep \
            "${{ steps.base.outputs.image }}" infinity
          docker exec wasmify-build bash -ceuxo pipefail '
            make tools
            bash scripts/wasi-configure.sh
            wasmify build --non-interactive
            wasmify generate-build
            wasmify parse-headers --header llama_api.h --clang "${WASI_SDK_PATH:-$HOME/.config/wasmify/bin/wasi-sdk}/bin/clang"
            wasmify gen-proto
            wasmify wasm-build --optimize --non-interactive
            rm -rf build
            eval "$(make -s print-wasm2go-env)"
            buf generate --timeout 0
            make bundle-gomod
          '

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Verify the built wasm reflects the applied patches
        # Every patches/*.patch must pass the artifact-level check it
        # registers in scripts/verify-patches (an unregistered patch fails).
        # A build log line saying "applied patch" is not evidence — a stale
        # object cache once shipped a release compiled from unpatched
        # sources — so the artifact itself is checked, before anything is
        # published. Same entry point as local use: make verify-patches.
        run: make verify-patches

      # The link check must run on the OLDEST Go the bundle declares
      # (its go.mod), not on `stable`: the cross-chunk ABI-wrapper cycle
      # that made v0.3.1 unlinkable fails on Go 1.25/1.26 and links
      # cleanly on 1.27, so a newer toolchain here would pass a bundle
      # that every consumer on the declared minimum cannot link.
      - uses: actions/setup-go@v5
        with:
          go-version-file: build/wasm2go/internal/wasm2go/go.mod
          cache: false

      - name: Link a consumer against the wasm2go bundle for every asm target
        # Package builds never exercise the linker; this catches bundles
        # that compile but cannot link (ABI-wrapper cycles across chunk
        # packages) before anything is staged, attested or published.
        run: go version && make link-check-bundle

      - name: Commit and push cache image
        # Cache miss + push events only. PR runs read the cache but never write.
        # The bind-mount means /work writes are not in the committable layer, so
        # copy the regenerable build state into a non-mounted path first.
        id: cache_push
        if: |
          steps.cache_pull.outputs.hit != 'true' &&
          github.event_name == 'push'
        run: |
          docker exec wasmify-build mkdir -p /cache/output/deps
          docker cp .wasmify "wasmify-build:/cache/output/"
          if [ -d deps/wasi-eh ]; then
            docker cp deps/wasi-eh "wasmify-build:/cache/output/deps/"
          fi
          docker commit wasmify-build "${{ steps.cache_key.outputs.tag }}"
          docker tag "${{ steps.cache_key.outputs.tag }}" "${CACHE_IMAGE}:latest"
          push_out=$(docker push "${{ steps.cache_key.outputs.tag }}" | tee /dev/stderr)
          digest=$(printf '%s\n' "$push_out" | grep -oE 'sha256:[a-f0-9]{64}' | head -n1)
          if [ -z "$digest" ]; then
            echo "::error::could not extract digest from docker push output" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker push "${CACHE_IMAGE}:latest"

      - name: Attest cache image build provenance
        if: |
          steps.cache_pull.outputs.hit != 'true' &&
          github.event_name == 'push' &&
          github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.CACHE_IMAGE }}
          subject-digest: ${{ steps.cache_push.outputs.digest }}
          push-to-registry: true

      - name: Stop build container
        if: always()
        run: docker rm -f wasmify-build 2>/dev/null || true

      - name: Stage build artifacts
        # The SAME files release.yml publishes as Release assets on a tag; here
        # they are only uploaded as a workflow artifact and attested.
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/llama.wasm release/llama.wasm
          cp build/wasm2go/llama.go release/llama_wasm2go.go
          tar -czf release/llama_wasm2go.tar.gz -C build/wasm2go/internal/wasm2go .
          ( cd build/wasm2go/internal/wasm2go && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > release/llama_wasm2go.sha256
          # The bundle is only usable as a Go module; bundle-gomod must have run.
          test -f build/wasm2go/internal/wasm2go/go.mod \
            || { echo "::error::bundle go.mod missing — make bundle-gomod did not run"; exit 1; }
          # The wasm must import nothing beyond WASI and the C++ exception tag:
          # anything else means a host dependency slipped in that a Go consumer
          # would have to implement.
          python3 scripts/check-imports.py release/llama.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: llama-wasm-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v2
        # Provenance only on `push` events and only when the repo is public.
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/llama.wasm
            release/llama_wasm2go.go

      - uses: actions/attest-build-provenance@v2
        # wasm2go bundle: one attestation whose subjects are the per-file digests
        # in the manifest, so any file extracted from the tarball verifies.
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          subject-checksums: release/llama_wasm2go.sha256

  # Encoder throughput of the bundle against a native llama.cpp build of
  # the same submodule commit, back to back on the same runner, on both
  # architectures: one encoder pass (embeddings) at 32/128/512 tokens with
  # 1 and 4 threads (the runners have 4 cores). The model is the public
  # sbintuitions/modernbert-ja-310m converted to Q8_0 by
  # bench/encoder/convert.py, cached by model, type, converter and
  # submodule commit. Reported in the step summary, not gated.
  bench-encoder:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goamd64: v2
          - os: ubuntu-24.04-arm
            goamd64: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The amd64 bundle carries its assembly only under GOAMD64=v2 or
      # higher; at v1 every vector helper is the scalar Go fallback.
      GOAMD64: ${{ matrix.goamd64 }}
      HF_MODEL: ${{ inputs.hf_model || 'sbintuitions/modernbert-ja-310m' }}
      FTYPE: q8_0
      MODEL_PATH: bench/encoder/model/encoder-q8_0.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/encoder/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: llama-wasm-${{ github.sha }}
          path: release
      - name: Unpack the bundle where bench/encoder/go.mod replaces it in
        run: |
          mkdir -p build/wasm2go/internal/wasm2go
          tar -xzf release/llama_wasm2go.tar.gz -C build/wasm2go/internal/wasm2go
          test -f build/wasm2go/internal/wasm2go/go.mod
      - name: Runner CPU
        id: cpu
        run: |
          model=$(lscpu | awk -F: '/Model name/ {gsub(/^ +/, "", $2); print $2; exit}')
          echo "model=${model:-unknown}" >> "$GITHUB_OUTPUT"
          echo "cpu: ${model:-unknown} ($(nproc) cores)"
          lscpu | grep -oE '\b(avx2|avx512f|avx512_vnni|avx_vnni|asimd|i8mm|sve)\b' | sort -u | tr '\n' ' '; echo
          echo "GOAMD64=$(go env GOAMD64)"
      - name: Submodule commit
        id: sub
        run: echo "sha=$(git -C llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the converted model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: encoder-model-${{ env.HF_MODEL }}-${{ env.FTYPE }}-${{ steps.sub.outputs.sha }}-${{ hashFiles('bench/encoder/convert.py') }}
      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Convert the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install -q -r llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          hf download "$HF_MODEL" --local-dir hf-model
          mkdir -p "$(dirname "$MODEL_PATH")"
          python bench/encoder/convert.py llama.cpp hf-model "$MODEL_PATH" "$FTYPE"
      - name: Cache native llama-bench
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native/llama-bench
          key: encoder-llama-bench-${{ steps.sub.outputs.sha }}-${{ matrix.os }}
      - name: Build native llama-bench
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S llama.cpp -B native/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=ON >/dev/null
          cmake --build native/build --target llama-bench -j "$(nproc)" 2>&1 | tail -2
          mkdir -p native && cp native/build/bin/llama-bench native/llama-bench
      - name: Native llama-bench
        run: |
          native/llama-bench -m "$MODEL_PATH" -p 32,128,512 -n 0 -t 1,4 -r 5 -embd 1 -ub 1024 -b 1024 -o json 2>/dev/null > native.json
          native/llama-bench -m "$MODEL_PATH" -p 32,128,512 -n 0 -t 1,4 -r 5 -embd 1 -ub 1024 -b 1024 2>/dev/null
      - name: Build the encoder benchmark
        working-directory: bench/encoder
        run: go build -o "$GITHUB_WORKSPACE/encoder-bin" .
      - name: go-llama probe (one 32-token pass, profiled)
        # A short pass first: its profile goes to the log, and the full
        # matrix below is skipped when the pass is far slower than it
        # should be (a broken dispatch would otherwise run for hours).
        timeout-minutes: 15
        run: |
          ./encoder-bin -model "$MODEL_PATH" -threads 1 -tokens 32 -reps 1 -json probe.json -cpuprofile probe.prof
          go tool pprof -top -nodecount=45 ./encoder-bin probe.prof 2>/dev/null | head -60
          ms=$(python3 -c 'import json; print(int(json.load(open("probe.json"))[0]["avg_ms"]))')
          echo "probe_ms=$ms" >> "$GITHUB_OUTPUT"
          echo "probe: $ms ms for 32 tokens, 1 thread"
        id: probe
      - name: go-llama probe with asynchronous preemption off
        if: steps.probe.outputs.probe_ms > 2000
        timeout-minutes: 15
        env:
          GODEBUG: asyncpreemptoff=1
        run: ./encoder-bin -model "$MODEL_PATH" -threads 1 -tokens 32 -reps 1
      - name: go-llama encoder pass
        if: steps.probe.outputs.probe_ms <= 2000
        run: ./encoder-bin -model "$MODEL_PATH" -threads 1,4 -tokens 32,128,512 -reps 5 -json encoder.json
      - name: go-llama profiled pass (512 tokens, 1 thread)
        if: steps.probe.outputs.probe_ms <= 2000
        run: |
          ./encoder-bin -model "$MODEL_PATH" -threads 1 -tokens 512 -reps 3 -cpuprofile pass512-t1.prof
          go tool pprof -top -nodecount=30 ./encoder-bin pass512-t1.prof 2>/dev/null | head -40
      - name: go-llama profiled pass (512 tokens, 4 threads)
        if: steps.probe.outputs.probe_ms <= 2000
        run: |
          ./encoder-bin -model "$MODEL_PATH" -threads 4 -tokens 512 -reps 3 -cpuprofile pass512-t4.prof
          go tool pprof -top -nodecount=30 ./encoder-bin pass512-t4.prof 2>/dev/null | head -40
      - name: Summary
        if: steps.probe.outputs.probe_ms <= 2000
        run: python3 bench/encoder/summary.py encoder.json native.json "$HF_MODEL $FTYPE on ${{ matrix.os }} (${{ steps.cpu.outputs.model }})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-encoder-${{ matrix.os }}
          path: |
            encoder.json
            native.json
            probe.json
            probe.prof
            pass512-t1.prof
            pass512-t4.prof
            encoder-bin
